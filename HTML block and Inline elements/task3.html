<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Course Registration</title>
</head>
<body>
  <h1>Course Registration Form</h1>
  <form>
    <fieldset>
      <legend>Student Details</legend>
      <label>Name: <input type="text" name="name"></label><br><br>
      <label>Email: <input type="email" name="email"></label><br><br>
      <label>Select Course:
        <select>
          <option>B.Tech CSE</option>
          <option>BCA</option>
          <option>MCA</option>
        </select>
      </label>
    </fieldset>
  </form>
  <h2>Course Schedule</h2>
  <table border="1">
    <tr>
      <th>Day</th>
      <th>Time</th>
      <th>Instructor</th>
    </tr>
    <tr>
      <td>Monday</td>
      <td>10:00 AM</td>
      <td>Mr. Hemant</td>
    </tr>
  </table>
</body>
</html>
