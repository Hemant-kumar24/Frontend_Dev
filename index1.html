<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Delivery Time Estimator</title>
  </head>
  <body>
    <script>
      let orderAmount = 450;
      let isPremium = false;
      let isRemote = true;
      let deliveryFee = 0;
      if (orderAmount < 500 && !isPremium) deliveryFee = 50;
      let totalCost = orderAmount + deliveryFee;
      let deliveryDays = 3 + (isRemote ? 2 : 0);
      console.log("Total cost: ₹" + totalCost);
      console.log("Estimated delivery time: " + deliveryDays + " days");
    </script>
  </body>
</html>
