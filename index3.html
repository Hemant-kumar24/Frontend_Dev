<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Cinema Ticketing System</title>
  </head>
  <body>
    <script>
      let show = "evening";
      let tickets = 4;
      let age = 20;
      let isStudent = true;
      let basePricePer = show === "morning" ? 120 : 180;
      let basePrice = basePricePer * tickets;
      let discount = 0;
      if (isStudent) discount = 0.1;
      if (age > 60) discount = Math.max(discount, 0.2);
      let discountedTotal = basePrice * (1 - discount);
      let finalAmount = discountedTotal + (tickets > 3 ? 50 : 0);
      console.log("Base price: ₹" + basePrice);
      console.log("Discounted total: ₹" + discountedTotal.toFixed(2));
      console.log("Final amount: ₹" + finalAmount.toFixed(2));
    </script>
  </body>
</html>
