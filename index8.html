<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Employee Bonus</title>
  </head>
  <body>
    <script>
      let rating = 5;
      let experience = 7;
      let salary = 120000;
      let bonusPercent = 0;
      if (rating === 5) bonusPercent = 20;
      else if (rating === 4) bonusPercent = 15;
      else if (rating === 3) bonusPercent = 10;
      if (experience > 5) bonusPercent += 5;
      let calculatedBonus = (salary * bonusPercent) / 100;
      if (calculatedBonus > 25000) calculatedBonus = 25000;
      let totalSalary = salary + calculatedBonus;
      console.log("Calculated Bonus: ₹" + calculatedBonus.toFixed(2));
      console.log("Total Salary After Bonus: ₹" + totalSalary.toFixed(2));
    </script>
  </body>
</html>
